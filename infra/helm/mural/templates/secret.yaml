apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mural.fullname" . }}-secret
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ include "mural.fullname" . }}-secret
type: Opaque
{{- $password := required "postgres.password é obrigatório (passe via --set ou Terraform)" .Values.postgres.password }}
stringData:
  DATABASE_URL: "postgres://{{ .Values.postgres.user }}:{{ $password }}@db:5432/{{ .Values.postgres.dbName }}?sslmode=disable"
  POSTGRES_PASSWORD: "{{ $password }}"