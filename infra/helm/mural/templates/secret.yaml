apiVersion: v1
kind: Secret
metadata:
  name: {{ include "mural.fullname" . }}-secret
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ include "mural.fullname" . }}-secret
type: Opaque
stringData:
  DATABASE_URL: "postgres://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@db:5432/{{ .Values.postgres.dbName }}?sslmode=disable"
  POSTGRES_PASSWORD: "{{ .Values.postgres.password }}"