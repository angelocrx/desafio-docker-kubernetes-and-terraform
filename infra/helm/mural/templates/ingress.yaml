apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mural-ingress
  namespace: aula-docker
spec:
  ingressClassName: nginx
  rules:
    - http: 
        paths:
          - path: /api(/|$)(.*)
            pathType: ImplementationSpecific
            backend:
              service:
                name: api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nginx-frontend
                port:
                  number: 80