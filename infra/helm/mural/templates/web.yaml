apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-frontend
  namespace: {{ .Values.namespace }}
  labels:
    app: nginx-frontend
spec:
  replicas: {{ .Values.web.replicaCount }}
  selector:
    matchLabels:
      app: nginx-frontend
  template:
    metadata:
      labels:
        app: nginx-frontend
    spec:
      containers:
        - name: frontend
          image: "{{ .Values.web.image }}:{{ .Values.web.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: {{ .Values.web.port }}
          env:
            - name: API_UPSTREAM
              value: "api:{{ .Values.api.port }}"
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-frontend
  namespace: {{ .Values.namespace }}
  labels:
    app: nginx-frontend
spec:
  type: ClusterIP
  ports:
    - port: {{ .Values.web.port }}
      targetPort: {{ .Values.web.port }}
  selector:
    app: nginx-frontend