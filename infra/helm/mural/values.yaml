namespace: aula-docker

global:
  environment: production

postgres:
  image: "postgres:16-alpine"
  user: "postgres"
  password: ""
  dbName: "aula-docker-mb"
  storage: "1Gi"
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

api:
  image: "docker-api"
  tag: "latest"
  replicaCount: 1
  port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 250m
      memory: 128Mi

web:
  image: "docker-frontend"
  tag: "latest"
  replicaCount: 1
  port: 8080
  resources:
    requests:
      cpu: 25m
      memory: 16Mi
    limits:
      cpu: 100m
      memory: 64Mi

ingress:
  enabled: true
  className: "traefik"
  host: "mural.localtest.me"
