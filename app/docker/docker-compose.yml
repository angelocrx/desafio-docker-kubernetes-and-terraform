version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: postgres-db
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 5432
      POSTGRES_DB: aula-docker-mb
    volumes:
      - ../api/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "psql -U postgres -d aula-docker-mb -t -c 'SELECT (COUNT(1) > 0) FROM messages;' | grep -q 't'"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: .. #voltar na raiz do projeto
      dockerfile: docker/web.Dockerfile
    container_name: nginx-frontend
    ports:
      - "9090:80"
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    container_name: go-backend
    ports:
      - "8080:8080" 
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://postgres:123456@postgres-db:5432/aula-docker-mb?sslmode=disable 
    restart: unless-stopped