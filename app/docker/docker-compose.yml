version: '3.8'

services:
  frontend:
    build:
      context: .. #voltar na raiz do projeto
      dockerfile: docker/web.Dockerfile
    container_name: nginx-frontend
    ports:
      - "9090:80"
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    container_name: go-backend
    ports:
      - "8080:8080" 
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://postgres:123456@localhost:5432/aula-docker-mb?sslmode=disable #todo: criar banco
    restart: unless-stopped